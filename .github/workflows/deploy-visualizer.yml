name: Deploy PARE Visualizer

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-visualizer.yml
      - examples/pare_outputs/**
      - tools/pare_visualizer/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Rebuild scores index
        run: python tools/pare_visualizer/scripts/build_scores_index.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: tools/pare_visualizer

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
