[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bioinfoagentbench"
version = "0.1.0"
description = "Task loading, scoring and metrics for BioinfoAgentBench"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
bioinfoagentbench = "bioinfoagentbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
