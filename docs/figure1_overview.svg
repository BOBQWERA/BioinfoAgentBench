<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">BioinfoAgentBench overview</title>
  <desc id="desc">A three-tier black-box evaluation framework covering baseline reliability, PARE fingerprinting, and frontier scientific challenges.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7fafc" />
      <stop offset="100%" stop-color="#eef4ff" />
    </linearGradient>
    <linearGradient id="cardBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="cardGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f9f6e" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="cardOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#23304f" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)" rx="28" />
  <circle cx="1090" cy="110" r="130" fill="#dbeafe" opacity="0.75" />
  <circle cx="140" cy="610" r="170" fill="#dcfce7" opacity="0.65" />

  <text x="70" y="86" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#2563eb">BioinfoAgentBench</text>
  <text x="70" y="132" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#14213d">
    Three-tier black-box evaluation for
  </text>
  <text x="70" y="176" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#14213d">
    heterogeneous bioinformatics agents
  </text>
  <text x="70" y="218" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#475569">
    Outputs and verifiable evidence are compared under a unified protocol, without relying on internal reasoning traces.
  </text>

  <rect x="70" y="278" width="320" height="292" rx="28" fill="url(#cardBlue)" filter="url(#shadow)" />
  <text x="102" y="332" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#dbeafe">Tier 1</text>
  <text x="102" y="372" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#ffffff">Baseline</text>
  <text x="102" y="404" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#dbeafe">Large-scale reliability reference</text>
  <text x="102" y="454" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff">3,238 public tasks in manuscript</text>
  <text x="102" y="490" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#eef2ff">Measures correctness, execution stability,</text>
  <text x="102" y="518" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#eef2ff">and resource cost across standardized workflows.</text>
  <text x="102" y="554" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#bfdbfe">Release note: this repository ships the public subset.</text>

  <rect x="440" y="278" width="320" height="292" rx="28" fill="url(#cardGreen)" filter="url(#shadow)" />
  <text x="472" y="332" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#d1fae5">Tier 2</text>
  <text x="472" y="372" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#ffffff">Fingerprint</text>
  <text x="472" y="404" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#d1fae5">Capability profiling with PARE</text>
  <text x="472" y="454" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff">300 structured questions in manuscript</text>
  <text x="472" y="490" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#ecfdf5">Maps differential task loads onto Planning,</text>
  <text x="472" y="518" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#ecfdf5">Action, Reflection, and Evolution dimensions.</text>
  <text x="472" y="554" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#bbf7d0">Used to compare systems and localize weaknesses.</text>

  <rect x="810" y="278" width="320" height="292" rx="28" fill="url(#cardOrange)" filter="url(#shadow)" />
  <text x="842" y="332" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffedd5">Tier 3</text>
  <text x="842" y="372" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#ffffff">Frontier</text>
  <text x="842" y="404" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#ffedd5">Open scientific challenge set</text>
  <text x="842" y="454" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff">216 literature-derived cases in manuscript</text>
  <text x="842" y="490" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#fff7ed">Tests whether agents can move beyond workflow</text>
  <text x="842" y="518" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#fff7ed">reproduction toward reasoning and insight generation.</text>
  <text x="842" y="554" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#fed7aa">Executable notebooks anchor evidence closure.</text>

  <path d="M390 424 C420 424, 420 424, 440 424" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
  <path d="M760 424 C790 424, 790 424, 810 424" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
  <polygon points="432,414 452,424 432,434" fill="#94a3b8" />
  <polygon points="802,414 822,424 802,434" fill="#94a3b8" />

  <rect x="70" y="612" width="1060" height="54" rx="18" fill="#ffffff" opacity="0.94" />
  <text x="104" y="646" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1e293b">Repository release contents:</text>
  <text x="365" y="646" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#475569">public benchmark assets, PARE scoring code, example outputs, supplementary materials, and the static visualizer.</text>
</svg>
